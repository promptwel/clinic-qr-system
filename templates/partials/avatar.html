{# Profile avatar. Usage: {% include 'partials/avatar.html' with photo=patient.profile_photo size=40 %} #}
{% if photo and 'default_profile' not in photo.name %}<img src="{{ photo.url }}" alt="" class="rounded-circle flex-shrink-0" style="width:{{ size|default:40 }}px;height:{{ size|default:40 }}px;object-fit:cover" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><i hidden class="bi bi-person-circle text-secondary flex-shrink-0" style="font-size:{{ size|default:40 }}px;line-height:1"></i>{% else %}<i class="bi bi-person-circle text-secondary flex-shrink-0" style="font-size:{{ size|default:40 }}px;line-height:1"></i>{% endif %}
